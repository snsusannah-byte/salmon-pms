services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salmon123}
      POSTGRES_DB: ${POSTGRES_DB:-salmon_pms}
    ports:
      - "127.0.0.1:15432:5432"  # 改为非标准端口，仅本机可访问
    volumes:
      # 数据映射到宿主机真实目录，便于备份
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salmon} -d ${POSTGRES_DB:-salmon_pms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salmon-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"  # 改为非标准端口
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - salmon-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-salmon}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-salmon12345}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - salmon-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    ports:
      - "18000:8000"  # 改为非标准端口
    volumes:
      # 上传文件持久化（退货附件等）
      - ../backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - salmon-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 生产构建时前端API地址（使用相对路径，由nginx反向代理）
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"   # 局域网访问入口
      - "443:443" # HTTPS（可选，需配置证书）
    depends_on:
      - backend
    networks:
      - salmon-net

networks:
  salmon-net:
    driver: bridge